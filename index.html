<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="theme-color" content="#5D4037" />
    <title>Marobel Beauty Studio | Spa y Servicios de Belleza en Guayaquil</title>
    <meta name="description" content="Descubre Marobel Beauty Studio en La Alborada, Guayaquil. Ofrecemos servicios premium de spa, uñas, cabello, faciales y masajes. Reserva tu cita hoy." />
    <meta name="keywords" content="spa en Guayaquil, servicios de belleza, manicure, faciales, reservas de spa, peluquería, masajes, La Alborada" />
    <meta property="og:title" content="Marobel Beauty Studio | Spa en Guayaquil" />
    <meta property="og:description" content="Servicios premium de belleza y bienestar en La Alborada, Guayaquil. Reserva tu momento de relajación." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const times = [];
        for (let hour = 9; hour <= 18; hour += 1) {
          times.push(`${hour}:00`);
          times.push(`${hour}:30`);
        }

        const patchAdminTimeSelect = () => {
          const labels = Array.from(document.querySelectorAll('label'));
          const label = labels.find((item) => item.textContent?.trim().toLowerCase() === 'bloquear horario');
          const select = label?.parentElement?.querySelector('select');
          if (!select || select.dataset.marobelTimeOptions === 'true') return;

          const currentValue = select.value || '09:00';
          select.innerHTML = times.map((time) => `<option value="${time}">${time}</option>`).join('');
          select.value = times.includes(currentValue) ? currentValue : '09:00';
          select.dataset.marobelTimeOptions = 'true';
        };

        const observer = new MutationObserver(patchAdminTimeSelect);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', patchAdminTimeSelect);
        patchAdminTimeSelect();
      })();
    </script>
  </body>
</html>
