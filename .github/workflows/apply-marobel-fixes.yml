name: Apply Marobel fixes

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-marobel-fixes.mjs
      - .github/workflows/apply-marobel-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fixes
        run: node scripts/apply-marobel-fixes.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminDashboard.tsx src/components/Calendar.tsx src/components/Services.tsx src/pages/CategoriaPage.tsx scripts/apply-marobel-fixes.mjs .github/workflows/apply-marobel-fixes.yml
          git commit -m "Apply Marobel admin and layout fixes"
          git push
