name: Apply client booking fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-client-booking-fixes.mjs
      - .github/workflows/apply-client-booking-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply changes
        run: node scripts/apply-client-booking-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run lint
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Calendar.tsx src/components/ReservationForm.tsx src/components/AdminDashboard.tsx src/components/Services.tsx src/components/PublicPromotions.tsx scripts/apply-client-booking-fixes.mjs .github/workflows/apply-client-booking-fixes.yml
          git commit -m "Impide reservar bloqueos y conecta promociones"
          git push
